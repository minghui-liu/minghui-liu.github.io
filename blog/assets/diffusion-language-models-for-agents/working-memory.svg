<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc"><title id="title">Growing history or maintained working memory?</title><desc id="desc">Left: an append-oriented agent grows its prompt and then compacts it. Right: observations revise bounded working memory for the reasoning model. Both retain a separate full trajectory archive.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#788591"/></marker></defs><rect width="760" height="510" rx="14" fill="#f8fafb"/><g font-family="Arial, sans-serif" fill="#243340"><text x="28" y="36" font-size="22" fill="#243340" font-weight="600" text-anchor="start">Growing history or maintained working memory?</text><text x="28" y="75" font-size="15" fill="#243340" font-weight="600" text-anchor="start">APPEND + COMPACT</text><text x="402" y="75" font-size="15" fill="#243340" font-weight="600" text-anchor="start">PROPOSED dLLM UPDATER</text><rect x="28" y="95" width="185" height="40" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="41" y="121" font-size="15" fill="#243340" font-weight="400" text-anchor="start">goal</text><path d="M120 135 L120 153" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="28" y="155" width="235" height="40" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="41" y="181" font-size="15" fill="#243340" font-weight="400" text-anchor="start">goal + action₁ + obs₁</text><path d="M120 195 L120 213" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="28" y="215" width="330" height="40" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="41" y="241" font-size="15" fill="#243340" font-weight="400" text-anchor="start">goal + … + action₁₀₀ + obs₁₀₀</text><path d="M193 255 L193 279" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="28" y="285" width="330" height="45" rx="9" fill="#fff0e9" stroke="#cbd5df"/><text x="193" y="313" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Context limit → compact</text><path d="M193 330 L193 350" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="193" y="375" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Continue accumulating</text><rect x="402" y="95" width="330" height="40" rx="9" fill="#e9eef5" stroke="#cbd5df"/><text x="567" y="121" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">New observation</text><path d="M567 135 L567 166" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="402" y="173" width="330" height="180" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="422" y="201" font-size="18" fill="#243340" font-weight="600" text-anchor="start">Mutable working context</text><text x="422" y="231" font-size="15" fill="#243340" font-weight="400" text-anchor="start">Goal · current plan</text><text x="422" y="260" font-size="15" fill="#243340" font-weight="400" text-anchor="start">Relevant facts · open questions</text><text x="422" y="289" font-size="15" fill="#243340" font-weight="400" text-anchor="start">Failed attempts · next action</text><text x="422" y="330" font-size="15" fill="#243340" font-weight="400" text-anchor="start">Revise after each interaction</text><path d="M567 353 L567 378" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="567" y="403" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Strong reasoning model</text><rect x="28" y="438" width="704" height="46" rx="9" fill="#eef1f8" stroke="#cbd5df"/><text x="380" y="467" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Full trajectory → external archive → retrieval when needed</text></g></svg>