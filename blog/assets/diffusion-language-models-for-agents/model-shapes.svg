<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title desc"><title id="title">Different model shapes, different operations</title><desc id="desc">An agent harness routes writing to an autoregressive model, bounded decisions to Jev, and editing to a diffusion model. Four candidate diffusion roles are drafting, deciding, infilling and context updating.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#788591"/></marker></defs><rect width="760" height="435" rx="14" fill="#f8fafb"/><g font-family="Arial, sans-serif" fill="#243340"><text x="28" y="36" font-size="22" fill="#243340" font-weight="600" text-anchor="start">Different model shapes, different operations</text><rect x="270" y="65" width="220" height="48" rx="9" fill="#e9eef5" stroke="#cbd5df"/><text x="380" y="95" font-size="17" fill="#243340" font-weight="600" text-anchor="middle">AGENT HARNESS</text><path d="M380 113 L134 161" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="28" y="167" width="212" height="139" rx="9" fill="#eef1f8" stroke="#cbd5df"/><text x="134" y="194" font-size="13" fill="#243340" font-weight="600" text-anchor="middle">WRITE</text><text x="134" y="231" font-size="25" fill="#243340" font-weight="600" text-anchor="middle">AR LM</text><text x="134" y="263" font-size="15" fill="#243340" font-weight="400" text-anchor="middle">Sequential generation</text><text x="134" y="286" font-size="14" fill="#243340" font-weight="400" text-anchor="middle">Reasoning and prose</text><path d="M380 113 L380 161" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="274" y="167" width="212" height="139" rx="9" fill="#fff3df" stroke="#cbd5df"/><text x="380" y="194" font-size="13" fill="#243340" font-weight="600" text-anchor="middle">DECIDE</text><text x="380" y="231" font-size="25" fill="#243340" font-weight="600" text-anchor="middle">Jev</text><text x="380" y="263" font-size="15" fill="#243340" font-weight="400" text-anchor="middle">Choices / probabilities</text><text x="380" y="286" font-size="14" fill="#243340" font-weight="400" text-anchor="middle">Bounded questions</text><path d="M380 113 L626 161" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><rect x="520" y="167" width="212" height="139" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="626" y="194" font-size="13" fill="#243340" font-weight="600" text-anchor="middle">EDIT</text><text x="626" y="231" font-size="25" fill="#243340" font-weight="600" text-anchor="middle">dLLM</text><text x="626" y="263" font-size="15" fill="#243340" font-weight="400" text-anchor="middle">Parallel infill / update</text><text x="626" y="286" font-size="14" fill="#243340" font-weight="400" text-anchor="middle">Partially specified state</text><text x="28" y="342" font-size="16" fill="#243340" font-weight="600" text-anchor="start">Four dLLM roles explored here</text><rect x="28" y="357" width="164" height="43" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="110" y="384" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Draft</text><rect x="208" y="357" width="164" height="43" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="290" y="384" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Decide</text><rect x="388" y="357" width="164" height="43" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="470" y="384" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Infill</text><rect x="568" y="357" width="164" height="43" rx="9" fill="#e5f3ee" stroke="#cbd5df"/><text x="650" y="384" font-size="16" fill="#243340" font-weight="400" text-anchor="middle">Update context</text></g></svg>