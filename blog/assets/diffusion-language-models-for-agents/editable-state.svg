<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">Three ways to respond to new evidence</title><desc id="desc">Autoregressive continuation appends a correction. Masked diffusion with remasking invalidates a token span and reconstructs it. Uniform diffusion replaces tokens during sampling. These are schematic interfaces, not exclusive capabilities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#788591"/></marker></defs><rect width="760" height="470" rx="14" fill="#f8fafb"/><g font-family="Arial, sans-serif" fill="#243340"><text x="28" y="36" font-size="22" fill="#243340" font-weight="600" text-anchor="start">Three ways to respond to new evidence</text><rect x="28" y="73" width="704" height="111" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="44" y="100" font-size="17" fill="#243340" font-weight="600" text-anchor="start">AR continuation</text><text x="713" y="100" font-size="14" fill="#607080" font-weight="400" text-anchor="end">Append</text><rect x="28" y="197" width="704" height="111" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="44" y="224" font-size="17" fill="#243340" font-weight="600" text-anchor="start">Masked diffusion + remasking</text><text x="713" y="224" font-size="14" fill="#607080" font-weight="400" text-anchor="end">Forget → reconstruct</text><rect x="28" y="321" width="704" height="111" rx="9" fill="#ffffff" stroke="#cbd5df"/><text x="44" y="348" font-size="17" fill="#243340" font-weight="600" text-anchor="start">Uniform diffusion</text><text x="713" y="348" font-size="14" fill="#607080" font-weight="400" text-anchor="end">Revise during sampling</text><text x="44" y="127" font-size="17" fill="#243340" font-weight="400" text-anchor="start" font-family="monospace">The bug is probably in database.py.</text><text x="44" y="159" font-size="17" fill="#286950" font-weight="400" text-anchor="start" font-family="monospace">↳ New evidence points to auth.py.</text><text x="44" y="253" font-size="17" fill="#243340" font-weight="400" text-anchor="start" font-family="monospace">The bug is probably in</text><rect x="282" y="232" width="115" height="32" rx="9" fill="#fff3df" stroke="#cbd5df"/><text x="293" y="253" font-size="17" fill="#243340" font-weight="400" text-anchor="start" font-family="monospace">[MASK]</text><path d="M409 249 L467 249" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="484" y="253" font-size="17" fill="#286950" font-weight="400" text-anchor="start" font-family="monospace">auth.py</text><text x="44" y="283" font-size="14" fill="#607080" font-weight="400" text-anchor="start">Explicitly invalidate the stale span, then reconstruct it.</text><text x="44" y="377" font-size="17" fill="#243340" font-weight="400" text-anchor="start" font-family="monospace">The bug is probably in</text><text x="282" y="377" font-size="17" fill="#243340" font-weight="400" text-anchor="start" font-family="monospace">database.py</text><path d="M412 371 L467 371" stroke="#788591" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="484" y="377" font-size="17" fill="#286950" font-weight="400" text-anchor="start" font-family="monospace">auth.py</text><text x="44" y="407" font-size="14" fill="#607080" font-weight="400" text-anchor="start">Token replacement remains available in the reverse process.</text><text x="28" y="456" font-size="13" fill="#607080" font-weight="400" text-anchor="start">Schematic spans: filenames may occupy multiple tokens.</text></g></svg>