<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">The agent rollout and training loop</title>
  <desc id="desc">Tasks flow to policy workers, which interact with environment workers. Trajectories go through a buffer and reward and value computation to a learner. Updated weights return to the policy workers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#687078"/>
    </marker>
    <style>
      .heading{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17181a}
      .text{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#25292c}
      .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#626970}
      .box{fill:#fff;stroke:#cfd3d6;stroke-width:1.5}
      .policy{fill:#edf4f8;stroke:#9fb9ca;stroke-width:1.5}
      .env{fill:#f4f2ed;stroke:#bbb5a8;stroke-width:1.5}
      .learn{fill:#eef5ef;stroke:#9db6a1;stroke-width:1.5}
      .line{stroke:#687078;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#87919a;stroke-width:1.6;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="500" rx="18" fill="#fafaf9"/>
  <text x="45" y="52" class="heading">Collection and learning share one loop</text>

  <rect x="55" y="105" width="150" height="72" rx="12" class="box"/>
  <text x="130" y="136" text-anchor="middle" class="text">Task queue</text>
  <text x="130" y="159" text-anchor="middle" class="small">prompts + resets</text>
  <path d="M205 141 H278" class="line"/>

  <rect x="283" y="105" width="170" height="72" rx="12" class="policy"/>
  <text x="368" y="136" text-anchor="middle" class="text">Policy workers</text>
  <text x="368" y="159" text-anchor="middle" class="small">generate actions</text>
  <path d="M453 127 H535" class="line"/>
  <path d="M535 158 H453" class="line"/>

  <rect x="540" y="105" width="180" height="72" rx="12" class="env"/>
  <text x="630" y="136" text-anchor="middle" class="text">Environment workers</text>
  <text x="630" y="159" text-anchor="middle" class="small">execute + observe</text>
  <text x="493" y="111" text-anchor="middle" class="small">actions</text>
  <text x="493" y="177" text-anchor="middle" class="small">observations</text>

  <path d="M630 177 V245 H718" class="line"/>
  <rect x="723" y="218" width="175" height="72" rx="12" class="box"/>
  <text x="810" y="249" text-anchor="middle" class="text">Trajectory buffer</text>
  <text x="810" y="272" text-anchor="middle" class="small">contexts + log probs</text>

  <path d="M723 275 H642 V333" class="line"/>
  <rect x="535" y="338" width="215" height="72" rx="12" class="box"/>
  <text x="642" y="369" text-anchor="middle" class="text">Reward + value</text>
  <text x="642" y="392" text-anchor="middle" class="small">returns + advantages</text>

  <path d="M535 374 H430" class="line"/>
  <rect x="255" y="338" width="170" height="72" rx="12" class="learn"/>
  <text x="340" y="369" text-anchor="middle" class="text">Learner</text>
  <text x="340" y="392" text-anchor="middle" class="small">policy update</text>

  <path d="M300 338 V258 H368 V182" class="dash"/>
  <text x="282" y="248" text-anchor="end" class="small">new weights</text>
  <text x="475" y="463" text-anchor="middle" class="small">Latency, environment capacity, and policy versioning now affect the data used by the optimizer.</text>
</svg>
